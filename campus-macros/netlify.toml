[build]
  command = "npm run build --workspace=web"
  publish = "web/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  node_module_format = "esm"
  external_node_modules = ["@libsql/client", "libsql"]

[functions."scrape"]
  schedule = "*/10 * * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
